<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%" style="background:#0b0b0f; border-radius:16px;">
  <defs>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="45" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">SKILLSYNC AI - SYSTEM ARCHITECTURE PIPELINE</text>

  <!-- Flow Boxes -->
  <!-- Box 1: Data Ingestion -->
  <rect x="50" y="150" width="160" height="140" rx="14" fill="#12121a" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
  <text x="130" y="195" fill="#00f0ff" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">DATA INGESTION</text>
  <text x="130" y="225" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• GitHub Repositories</text>
  <text x="130" y="245" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Multimodal Resumes</text>
  <text x="130" y="265" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Technical Assessments</text>

  <!-- Arrow 1 -->
  <path d="M 210 220 L 270 220" stroke="url(#gradCyan)" stroke-width="3" marker-end="url(#arrow)" />
  
  <!-- Box 2: Preprocessing & AST -->
  <rect x="270" y="150" width="180" height="140" rx="14" fill="#12121a" stroke="#3b82f6" stroke-width="2" filter="url(#glow)"/>
  <text x="360" y="195" fill="#3b82f6" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">AST & NLP ENGINE</text>
  <text x="360" y="225" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Tokenization & Embeddings</text>
  <text x="360" y="245" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Abstract Syntax Trees</text>
  <text x="360" y="265" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Skill Graph Extraction</text>

  <!-- Arrow 2 -->
  <path d="M 450 220 L 510 220" stroke="url(#gradPurple)" stroke-width="3" />

  <!-- Box 3: Deep Neural Model -->
  <rect x="510" y="130" width="200" height="180" rx="14" fill="#181824" stroke="#8b5cf6" stroke-width="2.5" filter="url(#glow)"/>
  <text x="610" y="175" fill="#8b5cf6" font-family="Inter, sans-serif" font-size="15" font-weight="800" text-anchor="middle">DEEP LEARNING MODEL</text>
  <text x="610" y="205" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">BERT + Graph Convolution</text>
  <text x="610" y="235" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Transformer Encoder</text>
  <text x="610" y="255" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Attention Mechanism</text>
  <text x="610" y="275" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Multi-Task Head</text>

  <!-- Arrow 3 -->
  <path d="M 710 220 L 770 220" stroke="url(#gradCyan)" stroke-width="3" />

  <!-- Box 4: Output Analytics -->
  <rect x="770" y="150" width="180" height="140" rx="14" fill="#12121a" stroke="#ec4899" stroke-width="2" filter="url(#glow)"/>
  <text x="860" y="195" fill="#ec4899" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">ANALYTICS DASHBOARD</text>
  <text x="860" y="225" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Skill Match Index</text>
  <text x="860" y="245" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Code Quality Metric</text>
  <text x="860" y="265" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Real-Time API JSON</text>
</svg>
