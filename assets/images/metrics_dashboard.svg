<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0b0b0f; border-radius:16px;">
  <rect x="20" y="20" width="760" height="460" rx="12" fill="#12121a" stroke="rgba(0,240,255,0.2)"/>
  <text x="50" y="60" fill="#00f0ff" font-family="sans-serif" font-size="16" font-weight="bold">MODEL ACCURACY & TRAINING LOSS CURVE</text>
  <path d="M 80 400 L 720 400" stroke="#333" stroke-width="2"/>
  <path d="M 80 100 L 80 400" stroke="#333" stroke-width="2"/>
  
  <!-- Loss curve -->
  <path d="M 80 140 Q 250 350 720 380" fill="none" stroke="#ec4899" stroke-width="3"/>
  <text x="550" y="360" fill="#ec4899" font-family="sans-serif" font-size="12">Training Loss (0.018)</text>

  <!-- Accuracy curve -->
  <path d="M 80 370 Q 250 160 720 120" fill="none" stroke="#00f0ff" stroke-width="3"/>
  <text x="550" y="140" fill="#00f0ff" font-family="sans-serif" font-size="12">Accuracy (98.4%)</text>
</svg>
